name: Validate public content

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test public publisher safety
        run: python3 -m unittest discover -s tests -v

      - name: Validate reviewed public content
        run: python3 tools/validate_public_content.py content

      - name: Build Quartz site
        run: npx quartz build

      - name: Install navigation-test browser
        run: npx playwright install --with-deps chromium

      - name: Test production explorer navigation
        run: npx playwright test tests/navigation.spec.mjs --workers=1 --reporter=line
